<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Webpage</title>

    <!-- CSS Styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c7a7b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #1a5f61;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        .container {
            padding: 20px;
        }

        img {
            width: 300px;
            border-radius: 10px;
        }

        button {
            background-color: #2c7a7b;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a5f61;
        }

        footer {
            text-align: center;
            background-color: #2c7a7b;
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<!-- HTML STRUCTURE -->

<header>
    <h1>Welcome to My Webpage</h1>
    <p>Basics of Web Development</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>About This Page</h2>
    <p>This webpage is created using HTML, CSS, and JavaScript.</p>

    <h3>Sample Image</h3>
    <img src="image.jpg" alt="Sample Image">

    <h3>Useful Link</h3>
    <p>
        Visit 
        <a href="https://www.w3schools.com" target="_blank">
            W3Schools
        </a> to learn more.
    </p>

    <h3>Interactive Button</h3>
    <button onclick="showMessage()">Click Me</button>
</div>

<footer>
    <p>© 2026 My Webpage</p>
</footer>

<!-- JavaScript -->
<script>
    function showMessage() {
        alert("Hello! You clicked the button 🎉");
    }
</script>

</body>
</html>
